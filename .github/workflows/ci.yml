name: CI

# Runs on every pull request. Without this, a branch could be merged red and the
# first thing to notice would be the deploy job on `main` -- after the merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The game app lives in client/; every `run:` step works from there.
defaults:
  run:
    working-directory: client

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must come before setup-node: `cache: pnpm` needs pnpm on PATH to work out
      # the store path. No `version:` input -- action-setup reads `packageManager`
      # from package.json, so CI and a laptop run the same pnpm.
      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # `--frozen-lockfile` and not a plain install: the lockfile is the answer.
      # This workspace has already been bitten by a resolved-at-install dependency
      # tree that differed from the one the tests were written against.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # Slower than it looks, on purpose: this includes the pack suite, which
      # re-runs the solver over all 65 committed levels and checks the recorded
      # optimal push count (invariant #17). A stale pack still parses and still
      # plays -- the only symptom is a HUD target nobody can reach and a star that
      # never lights. Re-solving is the only thing that catches it.
      - run: pnpm test

      - run: pnpm build

      - name: Report bundle size against NFR-PERF-09
        run: |
          # The threshold lives in docs/02-requirements/nfr.md: 200KB gzip for the
          # JS the first screen pulls. Printed rather than enforced -- the level
          # packs are code-split per difficulty, so the interesting number is the
          # shared chunk set, and a hard gate here would fire on a mistake this log
          # already makes visible.
          echo "gzip sizes of the built JS chunks:"
          total=0
          for f in $(find out/_next/static -name '*.js' | sort); do
            size=$(gzip -c "$f" | wc -c)
            total=$((total + size))
            printf '  %-52s %6.1f kB\n' "${f#out/_next/static/}" "$(echo "$size" | awk '{print $1/1024}')"
          done
          printf '  %-52s %6.1f kB\n' "TOTAL" "$(echo "$total" | awk '{print $1/1024}')"

  # A separate job so the browser suite runs beside the unit tests instead of
  # queueing behind them. It is also the only place that proves the built static
  # export actually plays: the unit suite never touches the DOM.
  e2e:
    name: Build and regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            automation-testing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The two static exports the suite serves: Ducker ID sign-in off (the deployed
      # build) and on against a fake issuer, into client/.e2e/.
      - name: Build both static exports
        run: pnpm build:e2e

      # The regression suite is its own package (automation-testing/). Both exports
      # are already built above, so CLIENT_PREBUILT=1 tells its webServer to only
      # serve client/.e2e/off and client/.e2e/on (scripts/e2e-serve.mjs), not build
      # them a second time.
      - name: Install the regression suite
        working-directory: automation-testing
        run: pnpm install --frozen-lockfile

      # `pnpm exec`, not `pnpm playwright`: there is no `playwright` script in
      # package.json, and `pnpm <name>` only runs scripts.
      - name: Install Chromium
        working-directory: automation-testing
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit, traceability
        working-directory: automation-testing
        run: pnpm typecheck && pnpm test:unit && pnpm coverage:check

      - name: Regression suite
        working-directory: automation-testing
        env:
          CLIENT_PREBUILT: "1"
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: automation-testing/playwright-report/
          retention-days: 7

  # NFR-SEC-05 in CI. ADR-0006 chose this job over an audit step because yarn 1's
  # audit endpoint had stopped answering -- `registry.yarnpkg.com/-/npm/v1/security/audits`
  # returned ESOCKETTIMEDOUT on a laptop and on a runner alike, so the step went green
  # without having checked anything, which is worse than no gate at all. That specific
  # reason died with the move to pnpm: `pnpm audit` queries the npm advisory endpoint
  # and does come back populated. The job stays anyway, because it is the better check
  # of the two -- it reads the dependency DIFF of the pull request, so it names the
  # commit that introduced the problem instead of reporting the whole tree every run.
  # GITHUB_TOKEN still cannot read Dependabot alerts (403 "Resource not accessible by
  # integration"), so that third option remains closed without a personal access token.
  #
  # This reviews the dependency diff of the pull request, which is where a vulnerable
  # dependency actually enters the project. A vulnerability newly disclosed against a
  # dependency already here arrives instead as a Dependabot alert and its automated
  # fix PR -- which then comes back through this same job.
  dependencies:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, high) has no patched release at
          # all. It only reaches the tree through build tooling - eslint-config-next
          # (fast-glob, micromatch) - so it never ships in the static export. Remove
          # this line once a fixed braces exists.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
